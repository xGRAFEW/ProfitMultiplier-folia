name: ProfitMultiplier

version: "${version}"
main: me.docdrewskii.profitmultiplier.ProfitMultiplier

api-version: "1.13"
folia-supported: true
description: Cumulative sell-progression multiplier for multiple shop plugins
author: DocDrewskii

softdepend:
  - Vault
  - EconomyShopGUI
  - EconomyShopGUI-Premium
  - ShopGUIPlus
  - zShop
  - UltimateShop
  - GUIShop
  - Essentials
  - PlaceholderAPI
  - Nexo
  - Oraxen
  - ItemsAdder
  - HeadDatabase

commands:
  profitmultiplier:
    description: ProfitMultiplier main command
    aliases: [pm, sellmulti]
    usage: "/pm <gui|reload|reset|resetall|stats>"
  sell:
    description: Open the built-in sell shop
    usage: "/sell"
  sellall:
    description: Sell every sellable item in your inventory
    usage: "/sellall"

permissions:
  profitmultiplier.admin:
    description: Access to ProfitMultiplier admin commands (reload, reset, resetall, open menus for others)
    default: op
  profitmultiplier.stats:
    description: Allows viewing your own sell-progression stats
    default: true
  profitmultiplier.gui:
    description: Allows opening the sell-multiplier menu
    default: true
  profitmultiplier.sell:
    description: Allows opening the built-in /sell shop
    default: true
  profitmultiplier.sellall:
    description: Allows using /sellall to sell every sellable item in your inventory
    default: true
