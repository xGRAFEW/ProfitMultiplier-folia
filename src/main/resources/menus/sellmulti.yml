title: "&8» &2&lSell Multipliers"
size: 45
update: true

status-unlocked: "&a&lUNLOCKED &a✔"
status-locked: "&c&lLOCKED &7(keep selling!)"

progress-bar:
  length: 20
  symbol: "▉"
  complete: "&a"
  incomplete: "&7"

filler:
  enabled: false
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# One tile per configured category (see "groups:" in config.yml). Clicking a tile only opens a
# read-only detail page for that category — it never changes which multiplier applies when you
# actually sell an item; that is always resolved automatically from the item itself.
content-slots:
  - "10-16"
  - "19-25"
  - "28-34"

content-source: groups

content:
  material: "{icon}"
  name: "&a&l{group_name}"
  lore:
    - "&7Sell items in this category to"
    - "&7upgrade your multiplier."
    - ""
    - "&7Current multiplier: &a{current_multiplier}x"
    - "&7Sold: &f{sold_short}&7/&f{threshold_short} &8(&e{progress_percent}%&8)"
    - "{progress_bar}"
    - ""
    - "&eClick to view items & prices"
  actions:
    any:
      - "[open] category-items"
      - "[sound] UI_BUTTON_CLICK 1 1.2"

items:
  price-rotation:
    material: CLOCK
    slot: 4
    name: "&b&lNext Price Reset"
    lore:
      - "&7Sell prices rotate on a schedule."
      - "&7Next reroll in: &e{price_reset_countdown}"
    actions:
      any:
        - "[sound] UI_BUTTON_CLICK 1 1"

  page-info:
    material: PAPER
    slot: 40
    name: "&fPage &a{page}&7/&a{total_pages}"
    lore:
      - "&7Browse every sell-multiplier category."
      - "&7Add more in config.yml and they show up here."

  previous:
    material: ARROW
    slot: 37
    name: "&e<- Previous Page"
    hide-on-first-page: true
    lore:
      - "&7Go to page &f{previous_page}&7."
    actions:
      any:
        - "[previous-page]"
        - "[sound] UI_BUTTON_CLICK 1 1"

  next:
    material: ARROW
    slot: 43
    name: "&eNext Page ->"
    hide-on-last-page: true
    lore:
      - "&7Go to page &f{next_page}&7."
    actions:
      any:
        - "[next-page]"
        - "[sound] UI_BUTTON_CLICK 1 1"

  close:
    material: BARRIER
    slot: 44
    name: "&c&lClose"
    lore:
      - "&7Click to close this menu."
    actions:
      any:
        - "[close]"
        - "[sound] UI_BUTTON_CLICK 1 1"
