hooks:
  EconomyShopGUI: true
  ShopGUIPlus: true
  zShop: true
  UltimateShop: true
  GUIShop: true
  Essentials: true

# Built-in shop (/sell, /sellall). Requires Vault + any Vault-compatible economy plugin
# (e.g. EssentialsX). An item is only sellable here if it has a "price"/"prices" entry below —
# items without one are simply not accepted. The same price also powers the {price} shown in
# the /sellmulti category-detail menu.
shop:
  sell-gui-title: "&aSell Menu"
  sell-gui-rows: 4

currency:
  symbol: "$"
  position: PREFIX
  format: "#,##0.##"
  custom:
    gems:
      symbol: " gems"
      position: SUFFIX
      format: "#,##0"
    tokens:
      symbol: "⛁ "
      position: PREFIX
      format: "#,##0"

items:
  DIAMOND:
    price: 120.0
    tiers:
      - threshold: 20
        multiplier: 1.1
      - threshold: 50
        multiplier: 1.25
      - threshold: 100
        multiplier: 1.5
  GOLD_INGOT:
    price: 20.0
    tiers:
      - threshold: 32
        multiplier: 1.15
      - threshold: 64
        multiplier: 1.3
  IRON_INGOT:
    price: 8.0
    tiers:
      - threshold: 64
        multiplier: 1.1
      - threshold: 128
        multiplier: 1.2

groups:
  crops:
    icon: GRASS_BLOCK
    display-name: "Crops"
    stack-mode: group
    materials:
      - WHEAT
      - CARROT
      - POTATO
      - BEETROOT
      - NETHER_WART
      - SUGAR_CANE
      - PUMPKIN
      - MELON
      - MELON_SLICE
      - KELP
      - BAMBOO
      - COCOA_BEANS
      - SWEET_BERRIES
      - GLOW_BERRIES
      - CACTUS
      - CHORUS_FRUIT
    prices:
      WHEAT: 3.0
      CARROT: 2.0
      POTATO: 2.0
      BEETROOT: 2.0
      NETHER_WART: 4.0
      SUGAR_CANE: 2.0
      PUMPKIN: 5.0
      MELON: 3.0
      MELON_SLICE: 1.0
      KELP: 1.0
      BAMBOO: 1.0
      COCOA_BEANS: 3.0
      SWEET_BERRIES: 2.0
      GLOW_BERRIES: 2.0
      CACTUS: 2.0
      CHORUS_FRUIT: 4.0
    tiers:
      - threshold: 10000
        multiplier: 1.1
        icon: GRASS_BLOCK
      - threshold: 100000
        multiplier: 1.2
        icon: WHEAT
      - threshold: 1000000
        multiplier: 1.3
        icon: KELP

  ores:
    icon: DIAMOND
    display-name: "Ores"
    stack-mode: stack
    materials:
      - DIAMOND
      - GOLD_INGOT
      - IRON_INGOT
      - EMERALD
      - COAL
      - REDSTONE
      - LAPIS_LAZULI
      - COPPER_INGOT
    prices:
      DIAMOND: 120.0
      GOLD_INGOT: 20.0
      IRON_INGOT: 8.0
      EMERALD: 100.0
      COAL: 3.0
      REDSTONE: 2.0
      LAPIS_LAZULI: 2.0
      COPPER_INGOT: 4.0
    tiers:
      - threshold: 5000
        multiplier: 1.1
        icon: IRON_INGOT
      - threshold: 50000
        multiplier: 1.2
        icon: GOLD_INGOT
      - threshold: 250000
        multiplier: 1.3
        icon: DIAMOND

  resources:
    icon: OAK_LOG
    display-name: "Resources"
    materials:
      - OAK_LOG
      - SPRUCE_LOG
      - BIRCH_LOG
      - JUNGLE_LOG
      - ACACIA_LOG
      - DARK_OAK_LOG
      - MANGROVE_LOG
      - CHERRY_LOG
      - CRIMSON_STEM
      - WARPED_STEM
    tiers:
      - threshold: 5000
        multiplier: 1.1
        icon: OAK_LOG
      - threshold: 50000
        multiplier: 1.2
        icon: BIRCH_LOG
      - threshold: 500000
        multiplier: 1.3
        icon: DARK_OAK_LOG

  excavation:
    icon: IRON_SHOVEL
    display-name: "Excavation"
    materials:
      - DIRT
      - COARSE_DIRT
      - SAND
      - RED_SAND
      - GRAVEL
      - CLAY_BALL
      - COBBLESTONE
      - COBBLED_DEEPSLATE
      - NETHERRACK
      - SOUL_SAND
    tiers:
      - threshold: 10000
        multiplier: 1.1
        icon: COBBLESTONE
      - threshold: 100000
        multiplier: 1.2
        icon: SAND
      - threshold: 1000000
        multiplier: 1.3
        icon: GRAVEL

  fishing:
    icon: COD
    display-name: "Fishing"
    currency: gems
    materials:
      - COD
      - SALMON
      - TROPICAL_FISH
      - PUFFERFISH
      - INK_SAC
      - PRISMARINE_SHARD
      - PRISMARINE_CRYSTALS
      - NAUTILUS_SHELL
    tiers:
      - threshold: 2000
        multiplier: 1.1
        icon: COD
      - threshold: 20000
        multiplier: 1.25
        icon: SALMON
      - threshold: 200000
        multiplier: 1.5
        icon: NAUTILUS_SHELL

  nether:
    icon: NETHERRACK
    display-name: "Nether"
    materials:
      - QUARTZ
      - GLOWSTONE_DUST
      - MAGMA_CREAM
      - GHAST_TEAR
      - NETHER_BRICK
      - BLAZE_POWDER
      - NETHERITE_SCRAP
      - ANCIENT_DEBRIS
      - CRYING_OBSIDIAN
    tiers:
      - threshold: 5000
        multiplier: 1.1
        icon: QUARTZ
      - threshold: 50000
        multiplier: 1.25
        icon: GLOWSTONE_DUST
      - threshold: 250000
        multiplier: 1.4
        icon: NETHERITE_SCRAP

  mob_drops:
    icon: ROTTEN_FLESH
    display-name: "Mob Drops"
    currency: tokens
    materials:
      - ROTTEN_FLESH
      - BONE
      - STRING
      - SPIDER_EYE
      - GUNPOWDER
      - ENDER_PEARL
      - SLIME_BALL
      - BLAZE_ROD
    tiers:
      - threshold: 5000
        multiplier: 1.1
        icon: BONE
      - threshold: 50000
        multiplier: 1.25
        icon: ENDER_PEARL
      - threshold: 500000
        multiplier: 1.5
        icon: BLAZE_ROD

  building:
    icon: BRICKS
    display-name: "Building Blocks"
    materials:
      - BRICK
      - BRICKS
      - STONE_BRICKS
      - SMOOTH_STONE
      - TERRACOTTA
      - QUARTZ_BLOCK
      - SANDSTONE
      - GLASS
    tiers:
      - threshold: 10000
        multiplier: 1.1
        icon: STONE_BRICKS
      - threshold: 100000
        multiplier: 1.2
        icon: TERRACOTTA
      - threshold: 1000000
        multiplier: 1.3
        icon: QUARTZ_BLOCK

default:
  enabled: true
  threshold: 1000
  multiplier: 1.1
  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK

threshold-scaling:
  enabled: false
  ranks:
    vip:
      permission: profitmultiplier.scale.vip
      scale: 0.8
    mvp:
      permission: profitmultiplier.scale.mvp
      scale: 0.65

milestones:
  include-default-ladder: false
  commands:
    on-tier: []
    on-max-tier: []
  discord:
    enabled: false
    webhook-url: ""
    username: "ProfitMultiplier"
    avatar-url: ""
    announce: max-tier
    style: embed
    embed:
      title: "🏆 Milestone reached!"
      description: "**{player}** unlocked **{multiplier}x** on **{name}**!"
      color: "#FFD700"
      thumbnail: "https://mc-heads.net/avatar/{uuid}"
      footer: "ProfitMultiplier"
      timestamp: true
      fields:
        - name: "Tier"
          value: "{tier}/{tiers}"
          inline: true
        - name: "Total sold"
          value: "{total_formatted}"
          inline: true
    components-v2:
      accent-color: "#FFD700"
      components:
        - type: section
          text: "## 🏆 Milestone reached\n**{player}** unlocked **{multiplier}x** on **{name}**"
          thumbnail: "https://mc-heads.net/avatar/{uuid}"
        - type: separator
        - type: text
          text: "-# Tier {tier}/{tiers} • Total sold: {total_formatted}"

auto-reset:
  enabled: false
  interval: WEEKLY

debug: false
